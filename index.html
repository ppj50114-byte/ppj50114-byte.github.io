<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>请输入密码访问 LokaLocal</title>
<style>
  :root{
    --bg1:#0f172a;
    --bg2:#1e293b;
    --accent:#7c3aed;
    --accent2:#06b6d4;
  }
  body{
    margin:0;
    min-height:100vh;
    font-family: Inter, system-ui, -apple-system, "Helvetica Neue", Arial;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    background-size: 200% 200%;
    animation: gradientMove 12s ease infinite;
  }
  @keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }

  .card{
    width:100%;
    max-width:460px;
    border-radius:14px;
    padding:28px;
    background: rgba(255,255,255,0.05);
    box-shadow: 0 6px 26px rgba(0,0,0,0.4);
    color:#e2e8f0;
    border:1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(6px);
  }

  h1{margin:0 0 10px 0;font-size:20px;font-weight:700;}
  p.lead{margin:0 0 22px 0;color:rgba(226,232,240,0.7);font-size:14px;}

  .form{display:flex;flex-direction:column;align-items:center;gap:16px;}
  .field{width:100%;max-width:360px;position:relative;}

  .input{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.02);
    color:#f8fafc;
    font-size:15px;
    transition: all .2s ease;
    text-security:disc;
    -webkit-text-security:disc;
  }
  .input:focus{
    outline:none;
    border-color: rgba(124,58,237,0.4);
    box-shadow:0 0 10px rgba(124,58,237,0.3);
    background: rgba(255,255,255,0.06);
  }

  .label{
    position:absolute;
    left:14px;
    top:10px;
    font-size:13px;
    color:rgba(255,255,255,0.6);
    pointer-events:none;
    transition:all .2s ease;
  }

  .input:not(:placeholder-shown) + .label,
  .input:focus + .label{
    top:-22px;
    left:8px;
    font-size:12px;
    color:#a5b4fc;
  }

  .btn{
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:white;
    border:none;
    border-radius:10px;
    padding:12px 18px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:all .15s ease;
    width:100%;
    max-width:360px;
  }
  .btn:active{transform:scale(0.98);}
  .msg{
    height:20px;
    font-size:14px;
    margin-top:10px;
    color:#9fc2d9;
    text-align:center;
  }
  .msg.error{color:#ffb4b4;}
  .msg.success{color:#b7f5d4;font-weight:700;}
</style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="title">
    <h1 id="title">请输入访问密码</h1>
    <p class="lead">输入正确密码后即可访问 LokaLocal 下载页面。</p>
    <form class="form" onsubmit="return false;">
      <div class="field">
        <input id="pwd" class="input" type="text" placeholder=" " autocomplete="off" inputmode="text" />
        <label for="pwd" class="label">访问密码</label>
      </div>
      <button id="submit" class="btn" type="button">确认</button>
      <div id="msg" class="msg"></div>
    </form>
  </main>
<script>
  const valid = ['发财888','李耀辉','张伟','赵志远','陈宁','郑刚','周子浩','尹浩宇','郭明辉','陈磊'];
  const pwd = document.getElementById('pwd');
  const btn = document.getElementById('submit');
  const msg = document.getElementById('msg');
  const card = document.querySelector('.card');

  function showError(t){ msg.className='msg error'; msg.textContent=t; }
  function showSuccess(t){ msg.className='msg success'; msg.textContent=t; }

  function verify(){
    const v = pwd.value.trim();
    if(!v){showError('请输入密码');return;}
    if(valid.includes(v)){
      showSuccess('验证成功，正在跳转…');
      card.style.opacity='0.96';
      setTimeout(()=>window.location.href='https://lokaxz.top',800);
    }else{
      showError('密码错误，请重试');
      pwd.value='';
      pwd.focus();
    }
  }

  btn.addEventListener('click',verify);
  pwd.addEventListener('keydown',e=>{if(e.key==='Enter')verify();});
</script>
</body>
</html>
